<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B6BA8" />
  <title>Carzen Wash · تطبيق ولوحة المغسلة</title>
  <link rel="icon" type="image/svg+xml" href="../../shared/assets/logo.svg" />
  <script>
    try {
      const l = localStorage.getItem("carzen_lang") || "ar";
      document.documentElement.lang = l;
      document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      if (localStorage.getItem("carzen_theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="../../shared/css/tokens.css" />
  <link rel="stylesheet" href="../../shared/css/base.css" />
  <link rel="stylesheet" href="../../shared/css/components.css" />
  <link rel="stylesheet" href="../../shared/css/skin.css" />
  <link rel="stylesheet" href="./css/dashboard.css" />
  <link rel="stylesheet" href="./css/ops.css" />
</head>
<body>
  <div class="dash-layout">
    <!-- Sidebar -->
    <aside id="dash-sidebar" class="dash-sidebar"></aside>

    <!-- Main Container -->
    <div class="dash-main">
      <header id="dash-topbar" class="dash-topbar"></header>
      <main id="dash-content" class="dash-content"></main>
    </div>
    <div id="dash-scrim" class="dash-scrim"></div>
    <nav id="dash-tabbar" class="dash-tabbar"></nav>
  </div>

  <script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
