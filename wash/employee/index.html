<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carzen · تطبيق الموظف</title>
  <script>
    try {
      const l = localStorage.getItem("carzen_lang") || "ar";
      document.documentElement.lang = l;
      document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      if (localStorage.getItem("carzen_theme") === "dark") document.documentElement.dataset.theme = "dark";
      if (!localStorage.getItem("carzen_staff_id")) {
        localStorage.setItem("carzen_staff_id", "st_samir");
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../../shared/css/tokens.css" />
  <link rel="stylesheet" href="../../shared/css/base.css" />
  <link rel="stylesheet" href="../../shared/css/components.css" />
  <link rel="stylesheet" href="./css/employee.css" />
</head>
<body class="emp-stage-body">
  <div class="emp-stage">
    <div class="emp-device">
      <div class="emp-device-inner">
        <div class="emp-status-bar">
          <span class="num" id="status-time">3:30</span>
          <span class="status-icons"><span>5G</span><span class="num">100%</span></span>
        </div>
        <div id="app" class="emp-app"></div>
        <nav id="emp-tabbar" class="emp-tabbar"></nav>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
