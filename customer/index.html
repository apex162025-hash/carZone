<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <title>Carzen · Customer</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
  <script>
    try {
      const l = localStorage.getItem("carzen_lang") || "ar";
      document.documentElement.lang = l;
      document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      if (localStorage.getItem("carzen_theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch (e) {}
    // Fit the 428×926 iPhone 13 Pro Max frame (plus bezel) into the window.
    function czFit() {
      var z = Math.min(1, (innerHeight - 56) / 946, (innerWidth - 32) / 448);
      document.documentElement.style.setProperty("--fit", Math.max(0.5, z).toFixed(3));
    }
    czFit();
    addEventListener("resize", czFit);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
